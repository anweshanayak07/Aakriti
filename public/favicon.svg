<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="aGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#AAD922" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#AAD922" stop-opacity="0"/>
    </radialGradient>

    <!-- Front Face Main Gradient -->
    <linearGradient id="frontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2FF66"/>
      <stop offset="45%" stop-color="#AAD922"/>
      <stop offset="100%" stop-color="#79A807"/>
    </linearGradient>

    <!-- Top Highlight Gradient -->
    <linearGradient id="topHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D7FF43"/>
    </linearGradient>

    <!-- Left Side Depth Gradient -->
    <linearGradient id="leftDepthGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#679402"/>
      <stop offset="60%" stop-color="#3C5900"/>
      <stop offset="100%" stop-color="#213300"/>
    </linearGradient>

    <!-- Right Outer Side Dark Shadow Gradient -->
    <linearGradient id="rightShadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#324901"/>
      <stop offset="70%" stop-color="#1A2800"/>
      <stop offset="100%" stop-color="#0B1200"/>
    </linearGradient>

    <!-- Inner Cutout Shadow Gradient -->
    <linearGradient id="innerShadowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#162200"/>
      <stop offset="100%" stop-color="#3D5B00"/>
    </linearGradient>

    <!-- Crossbar Gradient -->
    <linearGradient id="crossbarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8F82C"/>
      <stop offset="100%" stop-color="#93C409"/>
    </linearGradient>

    <!-- 3D Drop Shadow Filter -->
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#AAD922" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="50" cy="50" r="46" fill="url(#aGlow)"/>

  <!-- 3D Letter A Assembly -->
  <g filter="url(#shadow3d)">
    <!-- 1. LEFT LEG OUTER DEPTH SIDE -->
    <path d="M 45 12 L 37 18 L 10 82 L 18 78 Z" fill="url(#leftDepthGrad)"/>

    <!-- 2. RIGHT LEG OUTER DEPTH SHADOW -->
    <path d="M 45 12 L 82 78 L 89 73 L 53 8 Z" fill="url(#rightShadowGrad)"/>

    <!-- 3. INNER HOLE DEPTH WALL -->
    <path d="M 32 48 L 37 43 L 63 43 L 68 48 Z" fill="url(#innerShadowGrad)"/>

    <!-- 4. LEFT LEG FRONT FACE -->
    <path d="M 45 12 L 18 78 L 29 78 L 48 30 Z" fill="url(#frontGrad)"/>

    <!-- 5. RIGHT LEG FRONT FACE -->
    <path d="M 45 12 L 48 30 L 71 78 L 82 78 Z" fill="url(#frontGrad)"/>

    <!-- 6. TOP PEAK BEVEL HIGHLIGHT -->
    <path d="M 45 12 L 53 8 L 48 30 Z" fill="url(#topHighlight)" opacity="0.95"/>

    <!-- 7. 3D FLOATING CROSSBAR - FRONT FACE -->
    <path d="M 32 48 L 68 48 L 63 58 L 27 58 Z" fill="url(#crossbarGrad)"/>

    <!-- 8. 3D FLOATING CROSSBAR - TOP BEVEL -->
    <path d="M 32 48 L 37 43 L 73 43 L 68 48 Z" fill="url(#topHighlight)" opacity="0.9"/>

    <!-- 9. 3D FLOATING CROSSBAR - RIGHT SIDE DEPTH -->
    <path d="M 68 48 L 73 43 L 68 53 L 63 58 Z" fill="url(#rightShadowGrad)"/>

    <!-- 10. NEON EDGE HIGHLIGHT STRIPES -->
    <path d="M 45 12 L 18 78" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
    <path d="M 45 12 L 82 78" stroke="#E2FF66" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M 32 48 L 68 48" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.75"/>
  </g>
</svg>